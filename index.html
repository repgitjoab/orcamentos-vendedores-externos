<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Grupo Jorlan | Orçamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --black:#161616;
  --black-soft:#232323;
  --gold:#C9A227;
  --gold-deep:#a9860f;
  --gold-bg:#FBF3DC;
  --green:#1E8E3E;
  --green-bg:#E6F4EA;
  --red:#C0392B;
  --red-bg:#FBEAE8;
  --amber:#B7791F;
  --amber-bg:#FDF3E0;
  --gray-900:#1c1c1c;
  --gray-700:#4b4b4b;
  --gray-500:#7a7a7a;
  --gray-300:#d8d8d8;
  --gray-100:#f4f4f4;
  --bg:#f6f6f4;
  --card:#ffffff;
  --radius:14px;
  --shadow:0 2px 10px rgba(0,0,0,.06);
  --renault-accent:#FDB913;
  --gm-accent:#C9A227;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--gray-900);
  min-height:100vh;
}
h1,h2,h3,.font-display{font-family:'Poppins',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.hidden{display:none !important;}
img.logo{max-height:100%;max-width:100%;object-fit:contain;}
.logo-fallback{font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:.5px;}

/* ---------- Tela de seleção de marca ---------- */
#tela-marca{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 50% 0%, #232323 0%, #121212 60%);
  color:#fff;
  padding:24px;
}
.marca-titulo{
  text-align:center;
  margin-bottom:40px;
}
.marca-titulo .eyebrow{
  color:var(--gold);
  letter-spacing:3px;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
}
.marca-titulo h1{
  font-size:clamp(24px,4vw,36px);
  margin:8px 0 0;
}
.marca-grid{
  display:flex;
  gap:24px;
  flex-wrap:wrap;
  justify-content:center;
  width:100%;
  max-width:720px;
}
.marca-card{
  background:#1e1e1e;
  border:1px solid #333;
  border-radius:var(--radius);
  width:280px;
  padding:36px 24px;
  text-align:center;
  transition:transform .15s ease, border-color .15s ease, background .15s ease;
}
.marca-card:hover{
  transform:translateY(-4px);
  border-color:var(--gold);
  background:#242015;
}
.marca-card:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
.marca-logo-box{
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:18px;
}
.marca-card h3{margin:0 0 6px;font-size:20px;}
.marca-card p{margin:0;color:#aaa;font-size:13px;}
.marca-card button{
  margin-top:20px;
  background:var(--gold);
  color:#1a1a1a;
  border:none;
  border-radius:8px;
  padding:10px 22px;
  font-weight:700;
  font-size:14px;
}
.marca-card button:hover{background:#e0b92e;}

/* ---------- Tela de login ---------- */
#tela-login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  padding:24px;
}
.login-box{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  width:100%;
  max-width:380px;
  padding:36px 32px;
}
.login-box .voltar-marca{
  background:none;border:none;color:var(--gray-500);font-size:13px;padding:0;margin-bottom:18px;
}
.login-marca-header{
  display:flex;align-items:center;gap:12px;margin-bottom:24px;
}
.login-marca-header .marca-logo-box{height:44px;width:80px;margin:0;}
.login-marca-header h2{margin:0;font-size:18px;}
.campo{margin-bottom:16px;}
.campo label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;}
.campo input, .campo select, .campo textarea{
  width:100%;padding:10px 12px;border:1px solid var(--gray-300);border-radius:8px;font-size:14px;
}
.campo input:focus, .campo select:focus, .campo textarea:focus{outline:2px solid var(--gold);border-color:var(--gold);}
.btn{
  border:none;border-radius:8px;padding:11px 18px;font-weight:700;font-size:14px;
}
.btn-primary{background:var(--black);color:#fff;}
.btn-primary:hover{background:#000;}
.btn-gold{background:var(--gold);color:#1a1a1a;}
.btn-gold:hover{background:#e0b92e;}
.btn-outline{background:#fff;border:1px solid var(--gray-300);color:var(--gray-900);}
.btn-outline:hover{border-color:var(--gray-900);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.btn-danger:hover{background:#f6d6d2;}
.btn-block{width:100%;}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:6px;}
.erro-login{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:none;}
#app.ativo{display:flex;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--black);color:#eee;
  display:flex;flex-direction:column;padding:20px 14px;
}
.sidebar .brand-row{display:flex;align-items:center;gap:10px;padding:0 6px 20px;border-bottom:1px solid #2c2c2c;margin-bottom:16px;}
.sidebar .brand-row .marca-logo-box{height:34px;width:60px;margin:0;}
.sidebar .brand-row span{font-family:'Poppins';font-weight:700;font-size:13px;color:var(--gold);}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#ccc;
  font-size:14px;font-weight:600;margin-bottom:4px;border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:#232323;color:#fff;}
.nav-item.ativo{background:var(--gold);color:#1a1a1a;}
.nav-section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#777;margin:16px 6px 6px;font-weight:700;}
.sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid #2c2c2c;}
.user-mini{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1a1a1a;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.user-mini .nome{font-size:13px;font-weight:700;color:#fff;line-height:1.2;}
.user-mini .cargo{font-size:11px;color:#999;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:#fff;border-bottom:1px solid var(--gray-300);padding:14px 26px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;
}
.topbar h2{margin:0;font-size:19px;}
.content{padding:24px 26px 60px;flex:1;}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;
}
.badge-verde{background:var(--green-bg);color:var(--green);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-vermelho{background:var(--red-bg);color:var(--red);}
.badge-cinza{background:var(--gray-100);color:var(--gray-700);}
.badge-gold{background:var(--gold-bg);color:var(--gold-deep);}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  background:var(--black);color:#fff;text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;
}
thead th:first-child{border-radius:8px 0 0 8px;}
thead th:last-child{border-radius:0 8px 8px 0;}
tbody td{padding:10px 12px;border-bottom:1px solid var(--gray-100);vertical-align:middle;}
tbody tr:hover{background:#fafafa;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.toolbar input[type=text], .toolbar input[type=search]{
  padding:9px 12px;border:1px solid var(--gray-300);border-radius:8px;font-size:14px;min-width:220px;
}
.pill-filtros{display:flex;gap:6px;flex-wrap:wrap;}
.pill{
  padding:6px 12px;border-radius:20px;border:1px solid var(--gray-300);background:#fff;font-size:12.5px;font-weight:600;color:var(--gray-700);
}
.pill.ativo{background:var(--black);color:#fff;border-color:var(--black);}
.empty-state{text-align:center;padding:50px 20px;color:var(--gray-500);}
.empty-state h3{color:var(--gray-900);margin-bottom:6px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:900px){
  .grid-2,.grid-3{grid-template-columns:1fr;}
  #app.ativo{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:10px;align-items:center;}
  .sidebar .brand-row{display:none;}
  .nav-section-title{display:none;}
  .sidebar-footer{display:none;}
  .nav-item{white-space:nowrap;margin-bottom:0;margin-right:6px;}
  .content{padding:14px 12px 50px;}
  .topbar{padding:12px 14px;}
  .topbar h2{font-size:16px;}
  .card{padding:14px;}
}
@media (max-width:640px){
  table.tabela-responsiva thead{display:none;}
  table.tabela-responsiva, table.tabela-responsiva tbody, table.tabela-responsiva tr, table.tabela-responsiva td{
    display:block;width:100%;
  }
  table.tabela-responsiva tr{
    border-bottom:8px solid var(--bg);padding:10px 4px;
  }
  table.tabela-responsiva td{
    border:none;padding:5px 4px;text-align:left !important;
  }
  table.tabela-responsiva td[data-label]:not([data-label=""])::before{
    content:attr(data-label);display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;
    color:var(--gray-500);letter-spacing:.4px;margin-bottom:2px;
  }
  .marca-grid{gap:16px;}
  .marca-card{width:100%;max-width:320px;padding:26px 20px;}
  .login-box{padding:26px 22px;}
}
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50;
}
.modal{background:#fff;border-radius:var(--radius);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:26px;}
.modal h3{margin-top:0;}
.modal-close{float:right;background:none;border:none;font-size:20px;color:var(--gray-500);}
.stat-box{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
.stat-box .valor{font-family:'Poppins';font-size:26px;font-weight:800;}
.stat-box .rotulo{font-size:12.5px;color:var(--gray-500);font-weight:600;}
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--black);color:#fff;padding:13px 20px;border-radius:10px;
  font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:100;
  display:flex;align-items:center;gap:8px;
}
.toast.erro{background:var(--red);}
.toast.sucesso{background:var(--green);}
.alerta-caixa{
  display:flex;gap:12px;background:var(--gold-bg);border-left:4px solid var(--gold);border-radius:10px;padding:14px 16px;
  font-size:13px;color:#5c4813;margin-bottom:18px;
}
.info-caixa{
  display:flex;gap:12px;background:#eef3fb;border-left:4px solid #3b6fb0;border-radius:10px;padding:14px 16px;
  font-size:13px;color:#2a4a72;margin-bottom:18px;
}
</style>
</head>
<body>

<!-- ============ TELA 1: SELEÇÃO DE MARCA ============ -->
<div id="tela-marca">
  <div class="marca-titulo">
    <div class="eyebrow">Grupo Jorlan · Vendedores Externos</div>
    <h1>Selecione a marca</h1>
  </div>
  <div class="marca-grid">
    <div class="marca-card" tabindex="0" role="button" onclick="selecionarMarca('Renault')" onkeydown="if(event.key==='Enter')selecionarMarca('Renault')">
      <div class="marca-logo-box">
        <img class="logo" src="assets/logo-renault.png" alt="Renault" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <div class="logo-fallback" style="display:none;color:#FDB913;font-size:26px;">RENAULT</div>
      </div>
      <h3>Peças Renault</h3>
      <p>Orçamentos para a linha Renault</p>
      <button>Entrar</button>
    </div>
    <div class="marca-card" tabindex="0" role="button" onclick="selecionarMarca('GM')" onkeydown="if(event.key==='Enter')selecionarMarca('GM')">
      <div class="marca-logo-box">
        <img class="logo" src="assets/logo-gm.png" alt="GM" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <div class="logo-fallback" style="display:none;color:#C9A227;font-size:26px;">CHEVROLET</div>
      </div>
      <h3>Peças GM</h3>
      <p>Orçamentos para a linha Chevrolet</p>
      <button>Entrar</button>
    </div>
  </div>
</div>

<!-- ============ TELA 2: LOGIN ============ -->
<div id="tela-login" class="hidden">
  <div class="login-box">
    <button class="voltar-marca" onclick="voltarParaMarca()">&larr; Trocar marca</button>
    <div class="login-marca-header">
      <div class="marca-logo-box" id="login-logo-box"></div>
      <h2 id="login-marca-nome"></h2>
    </div>
    <form onsubmit="return fazerLogin(event)">
      <div class="campo">
        <label>Usuário</label>
        <input type="text" id="login-usuario" autocomplete="username" required>
      </div>
      <div class="campo">
        <label>Senha</label>
        <input type="password" id="login-senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <div class="erro-login" id="login-erro"></div>
    </form>
  </div>
</div>

<!-- ============ APP PRINCIPAL ============ -->
<div id="app">
  <aside class="sidebar">
    <div class="brand-row">
      <div class="marca-logo-box" id="sidebar-logo-box"></div>
      <span id="sidebar-marca-nome"></span>
    </div>
    <nav id="nav-list"></nav>
    <div class="sidebar-footer">
      <div class="user-mini">
        <div class="avatar" id="avatar-iniciais"></div>
        <div>
          <div class="nome" id="user-nome"></div>
          <div class="cargo" id="user-cargo"></div>
        </div>
      </div>
      <button class="btn btn-outline btn-block btn-sm" onclick="sair()">Sair</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h2 id="topbar-titulo">Consulta de Produtos</h2>
      <div id="topbar-acoes"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="produtos_renault.js"></script>
<script src="produtos_gm.js"></script>
<script src="app.js"></script>
<script src="telas.js"></script>
<script src="telas2.js"></script>
<script src="telas3.js"></script>
</body>
</html>
